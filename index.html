<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrystalLog - 成長の結晶</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-app">
        
        <!-- 上部：鍾乳洞と結晶のステージ -->
        <div class="cave-stage" id="stage">
            
            <div class="top-info">
                <div class="level-badge">LEVEL <span id="levelValue">1</span></div>
                <div class="streak-badge">🔥 <span id="streakValue">1</span>日目</div>
                <button class="log-btn" id="openLogBtn">📜 記録</button>
            </div>

            <!-- 天井の雫の発生源 (背景画像に鍾乳石が含まれるため非表示) -->
            <div class="stalactite-area">
                <div class="drop-origin" id="dropOrigin"></div>
            </div>

            <!-- 成長する結晶 (AI生成画像を使用) -->
            <div class="crystal-area">
                <div class="crystal-glow" id="crystalGlow"></div>
                <div class="crystal-wrapper" id="mainCrystal">
                    <img src="crystal.png" alt="Crystal" class="crystal-img">
                    <div class="color-overlay"></div>
                </div>
            </div>
            
            <!-- 波紋用コンテナ -->
            <div class="ripple-container" id="rippleContainer"></div>
        </div>

        <!-- 下部：成長入力パネル -->
        <div class="bottom-panel">
            <div class="action-area">
                <p class="action-title">今日の自己成長を記録する</p>
                <div class="input-group">
                    <input type="text" id="growthInput" placeholder="例: 本を30分読んだ" autocomplete="off">
                    <button class="translate-btn" id="dropBtn">雫</button>
                </div>
            </div>
        </div>

        <!-- ログモーダル -->
        <div class="log-modal" id="logModal">
            <div class="log-modal-header">
                <h3>成長の軌跡</h3>
                <button class="close-btn" id="closeLogBtn">×</button>
            </div>
            <div class="log-list-container" id="logListContainer">
                <!-- ログアイテムがここに追加される -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
